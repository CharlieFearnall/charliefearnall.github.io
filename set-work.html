<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Work - Charlie Fearnall</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- ***** Header ***** -->
  <header class="header set-header">
    <nav class="nav">
      <ul class="nav__items">
        <li class="nav__item"><a href="index.html" class="nav__link">Home</a></li>
        <li class="nav__item"><a href="set-work.html" class="nav__link">Set Work</a></li>
        <li class="nav__item"><a href="art-work.html" class="nav__link">Art Work</a></li>
      </ul>
    </nav>

    <!-- Fullscreen background -->
    <video autoplay muted loop playsinline class="header-video">
      <source src="images/set-work.mp4" type="video/mp4">
      <img src="images/set-work.jpg" alt="Set Work Background">
    </video>

    <div class="header__text-box">
      <h1 class="heading-primary"><span class="falling-letters">Set Work</span></h1>
    </div>
  </header>

  <!-- ***** Main Content ***** -->
  <main>
    <section class="portfolio-section">
      <div class="portfolio-grid">
        <div class="portfolio-item full">
          <img src="images/set1.jpg" alt="Set Work 1">
        </div>
        <div class="portfolio-item">
          <img src="images/set2.jpg" alt="Set Work 2">
        </div>
        <div class="portfolio-item">
          <img src="images/set3.jpg" alt="Set Work 3">
        </div>
        <div class="portfolio-item full">
          <img src="images/set4.jpg" alt="Set Work 4">
        </div>
      </div>
    </section>
  </main>

  <!-- Custom cursor -->
  <div id="custom-cursor"></div>
  <script src="index.js"></script>
</body>
</html>
