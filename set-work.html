<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Work - Charlie Fearnall</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- ***** Header ***** -->
  <header class="header" role="banner">
    <div class="row">
      <nav class="nav" role="navigation">
        <ul class="nav__items">
          <li class="nav__item"><a href="index.html" class="nav__link">Home</a></li>
          <li class="nav__item"><a href="set-work.html" class="nav__link">Set Work</a></li>
          <li class="nav__item"><a href="art-work.html" class="nav__link">Art Work</a></li>
        </ul>
      </nav>
    </div>

    <!-- Fullscreen background -->
    <video autoplay muted loop playsinline class="header-video">
      <source src="video/hero.mp4" type="video/mp4">
      <!-- fallback image -->
      <img src="images/header.jpg" alt="Background">
    </video>

    <div class="header__text-box row">
      <div class="header__text">
        <h1 class="heading-primary">Set Work</h1>
      </div>
    </div>
  </header>

  <!-- ***** Main Content ***** -->
  <main role="main">
    <section class="portfolio-section">
      <div class="portfolio-grid">
        <div class="portfolio-item">
          <img src="photos/screen1.jpg" alt="Set Work 1">
        </div>
        <div class="portfolio-item">
          <img src="photos/screen2.jpg" alt="Set Work 2">
        </div>
        <div class="portfolio-item">
          <img src="photos/screen3.jpg" alt="Set Work 3">
        </div>
        <div class="portfolio-item">
          <img src="photos/screen4.jpg" alt="Set Work 4">

  <script src="index.js"></script>

</html>
